<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Kan 11 in English</title>
<style>
html,body{margin:0;background:#000;color:#f4f4f6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;height:100%}
.wrap{display:flex;flex-direction:column;height:100%}
video{flex:1 1 auto;width:100%;min-height:0;background:#000;outline:0}
video::cue{background:rgba(0,0,0,.72);color:#fff;font-size:calc(1.6vw + 12px);line-height:1.25;padding:.1em .3em}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));font-size:14px}
.bar .t{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar a{color:rgba(244,244,246,.7);text-decoration:none}
.bar a:hover{color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <video id="v" controls autoplay playsinline crossorigin="anonymous"></video>
  <div class="bar"><a href="/">&larr; Shows</a><span class="t" id="t"></span><a id="vlc" href="#" hidden>Open in VLC</a><a id="dl" href="#">File</a></div>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var file = q.get('v') || '';          // /Kan/Show/Show S01E01 - Title.mp4 (already percent-encoded)
  var title = q.get('t') || 'Kan 11';
  document.title = title; document.getElementById('t').textContent = title;
  var v = document.getElementById('v');
  var src = document.createElement('source'); src.src = file; src.type = 'video/mp4'; v.appendChild(src);
  var tr = document.createElement('track');
  tr.kind = 'subtitles'; tr.srclang = 'en'; tr.label = 'English'; tr.default = true;
  tr.src = file.replace(/\.mp4$/i, '.en.vtt'); v.appendChild(tr);
  v.addEventListener('loadedmetadata', function(){ for (var i = 0; i < v.textTracks.length; i++) v.textTracks[i].mode = 'showing'; });
  document.getElementById('dl').href = file;
  if (/Android/i.test(navigator.userAgent)) {
    var a = document.getElementById('vlc');
    a.href = 'intent://' + location.host + file + '#Intent;scheme=' + location.protocol.replace(':','') + ';type=video/mp4;package=org.videolan.vlc;end';
    a.hidden = false;
  }
  // Remote / keyboard: OK toggles play, left/right seek 10 s, Back returns to the list.
  document.addEventListener('keydown', function(ev){
    var k = ev.keyCode;
    if (k === 13 || k === 32) { if (v.paused) v.play(); else v.pause(); }
    else if (k === 37) v.currentTime = Math.max(0, v.currentTime - 10);
    else if (k === 39) v.currentTime = Math.min(v.duration || 1e9, v.currentTime + 10);
    else if (k === 27 || k === 10009 || k === 461 || k === 8) { location.href = "/"; }
    else return;
    ev.preventDefault();
  });
  // Resume where the episode was left (per file, in this browser).
  var key = 'kan:' + file;
  try { var at = parseFloat(localStorage.getItem(key) || '0'); if (at > 30) v.addEventListener('loadedmetadata', function(){ if (at < v.duration - 60) v.currentTime = at; }, {once:true}); } catch(e){}
  setInterval(function(){ try { if (!v.paused && v.currentTime > 0) localStorage.setItem(key, String(v.currentTime)); } catch(e){} }, 5000);
})();
</script>
</body>
</html>
